<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음성 → 텍스트 → 영어 번역 → 읽어주기 (편집 가능)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    margin: 0; padding: 24px; background: #0f1115; color: #e6e8ee;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 1100px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  button {
    padding: 10px 18px; border: 0; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; background: #2b7fff; color: #fff;
  }
  button.stop { background: #e5484d; }
  button.ghost { background: #252932; color: #c9ccd6; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  select {
    padding: 9px 12px; border-radius: 8px; max-width: 230px;
    background: #252932; color: #e6e8ee; border: 1px solid #353a46;
  }
  .ttsbar {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    padding: 11px 14px; border: 1px solid #353a46; border-radius: 9px;
    background: #15181f; margin-bottom: 14px; font-size: 13px; color: #a8adbb;
  }
  .ttsbar label { display: flex; align-items: center; gap: 7px; }
  input[type=range] { width: 100px; accent-color: #2b7fff; }
  input[type=checkbox] { accent-color: #2b7fff; width: 16px; height: 16px; }
  #status { font-size: 13px; color: #8b90a0; display: flex; align-items: center; gap: 7px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555b68; }
  .dot.on { background: #30d158; animation: pulse 1.2s infinite; }
  .dot.speak { background: #f0c674; animation: pulse .8s infinite; }
  .dot.edit { background: #2b7fff; }
  @keyframes pulse { 50% { opacity: .25; } }
  #meter { height: 6px; background: #252932; border-radius: 3px; overflow: hidden; margin: 12px 0 16px; }
  #meterFill { height: 100%; width: 0%; background: #30d158; transition: width .08s; }

  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 820px) { .panes { grid-template-columns: 1fr; } }
  .pane h2 {
    font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: #8b90a0; margin: 0 0 7px; display: flex; justify-content: space-between;
  }
  .box {
    height: 360px; padding: 10px; border-radius: 10px;
    border: 1px solid #353a46; background: #181b22; overflow-y: auto;
  }
  .box.en { border-color: #2b4a7f; background: #141a24; }

  .row { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 4px; }
  .idx {
    flex: 0 0 24px; text-align: right; font-size: 11px; color: #4e5566;
    padding-top: 7px; user-select: none;
  }
  .txt {
    flex: 1; padding: 5px 8px; border-radius: 6px; font-size: 15px; line-height: 1.65;
    border: 1px solid transparent; outline: none; white-space: pre-wrap; word-break: break-word;
    cursor: text;
  }
  .txt:hover { background: #1f2735; }
  .txt:focus { background: #1d2430; border-color: #2b7fff; cursor: text; }
  .txt.pending { color: #7f8696; }
  .txt.speaking { background: #3a2f12; color: #ffd98a; }
  .txt.edited { border-left: 3px solid #2b7fff; }
  .tools { display: flex; flex-direction: column; gap: 3px; padding-top: 4px; }
  .mini {
    width: 24px; height: 22px; padding: 0; font-size: 11px; line-height: 1;
    background: #252932; color: #9aa0ae; border-radius: 5px; font-weight: 400;
  }
  .mini:hover { background: #333948; color: #fff; }
  .mini.del:hover { background: #e5484d; color: #fff; }
  #interimRow { display: none; }
  #interimTxt { color: #7f8696; font-style: italic; }

  .banner {
    padding: 12px 14px; border-radius: 8px; background: #2a2015;
    border: 1px solid #5a4420; color: #f0c674; font-size: 13px;
    line-height: 1.65; margin-bottom: 14px; display: none;
  }
  code { background: #000; padding: 1px 5px; border-radius: 4px; }
  .hint { font-size: 12px; color: #6d7382; margin-top: 14px; line-height: 1.75; }
  kbd {
    background: #252932; border: 1px solid #434a59; border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #c9ccd6;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>마이크 음성 → 텍스트 → 영어 번역 → 읽어주기 <span style="font-size:13px;color:#6d7382">(키보드 수정 가능)</span></h1>

  <div id="banner" class="banner"></div>

  <div class="bar">
    <button id="startBtn">● 녹음 시작</button>
    <button id="stopBtn" class="stop" disabled>■ 중지</button>
    <button id="addBtn" class="ghost">＋ 직접 입력</button>
    <button id="speakAllBtn" class="ghost">▶ 전체 읽기</button>
    <button id="stopSpeakBtn" class="ghost">⏹ 읽기 중지</button>
    <button id="clearBtn" class="ghost">지우기</button>
    <button id="copyBtn" class="ghost">영문 복사</button>
    <select id="lang">
      <option value="ko-KR" data-t="ko">한국어 → English</option>
      <option value="ja-JP" data-t="ja">日本語 → English</option>
      <option value="zh-CN" data-t="zh">中文 → English</option>
      <option value="es-ES" data-t="es">Español → English</option>
      <option value="en-US" data-t="en">English → English (번역 없음)</option>
    </select>
  </div>

  <div class="ttsbar">
    <label><input type="checkbox" id="autoSpeak" checked> 자동 읽기</label>
    <label><input type="checkbox" id="reSpeak"> 수정 시 재낭독</label>
    <label>음성 <select id="voiceSel"><option>로딩 중…</option></select></label>
    <label>속도 <input type="range" id="rate" min="0.5" max="1.8" step="0.1" value="1"><span id="rateVal">1.0</span></label>
    <label>높이 <input type="range" id="pitch" min="0" max="2" step="0.1" value="1"><span id="pitchVal">1.0</span></label>
    <label>볼륨 <input type="range" id="vol" min="0" max="1" step="0.1" value="1"><span id="volVal">1.0</span></label>
  </div>

  <div id="status"><span class="dot" id="dot"></span><span id="statusText">대기 중</span></div>
  <div id="meter"><div id="meterFill"></div></div>

  <div class="panes">
    <div class="pane">
      <h2><span>원문 (클릭 후 수정)</span><span id="srcLabel">ko</span></h2>
      <div id="srcBox" class="box">
        <div class="row" id="interimRow"><div class="idx">…</div><div class="txt" id="interimTxt"></div></div>
      </div>
    </div>
    <div class="pane">
      <h2><span>영어 번역 (클릭 후 수정)</span><span id="trStatus">—</span></h2>
      <div id="enBox" class="box en"></div>
    </div>
  </div>

  <p class="hint">
    <b>수정 방법</b> — 원문/번역문 어느 쪽이든 클릭하면 바로 편집됩니다.
    <kbd>Enter</kbd> 확정 · <kbd>Esc</kbd> 취소 · <kbd>Shift+Enter</kbd> 줄바꿈 ·
    <kbd>Tab</kbd> 다음 줄.<br>
    <b>원문을 고치면</b> 해당 문장만 자동 재번역됩니다. <b>번역문을 고치면</b> 그 내용이 그대로 낭독에 반영됩니다.
    행 오른쪽 <code>▶</code> 재생 · <code>×</code> 삭제.<br>
    편집 중에는 음성 인식이 자동 일시정지되어 입력이 끼어들지 않습니다.
  </p>
</div>

<script>
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synth = window.speechSynthesis;
  const $ = id => document.getElementById(id);
  const startBtn=$('startBtn'), stopBtn=$('stopBtn'), addBtn=$('addBtn'),
        speakAllBtn=$('speakAllBtn'), stopSpeakBtn=$('stopSpeakBtn'),
        clearBtn=$('clearBtn'), copyBtn=$('copyBtn'), langSel=$('lang'),
        srcBox=$('srcBox'), enBox=$('enBox'), dot=$('dot'), statusText=$('statusText'),
        meterFill=$('meterFill'), banner=$('banner'), trStatus=$('trStatus'),
        srcLabel=$('srcLabel'), autoSpeak=$('autoSpeak'), reSpeak=$('reSpeak'),
        voiceSel=$('voiceSel'), rate=$('rate'), pitch=$('pitch'), vol=$('vol'),
        interimRow=$('interimRow'), interimTxt=$('interimTxt');

  let recog=null, manualStop=false, listening=false;
  let audioCtx, analyser, micStream, rafId;
  let translator=null, translatorLang=null;
  let speakQueue=[], speaking=false, pausedForTTS=false, pausedForEdit=false;
  let rows=[], seq=0;

  function setStatus(t, mode) {
    statusText.textContent = t;
    dot.className = 'dot' + (mode ? ' '+mode : '');
  }
  function autoScroll(box) {
    if (document.activeElement && document.activeElement.classList.contains('txt')) return;
    box.scrollTop = box.scrollHeight;
  }

  if (!SR) {
    banner.style.display='block';
    banner.innerHTML='이 브라우저는 음성 인식(Web Speech API)을 지원하지 않습니다. <b>Chrome</b>/<b>Edge</b> 권장. ' +
                     '다만 <b>＋ 직접 입력</b> 버튼으로 수동 입력·번역·낭독은 사용할 수 있습니다.';
    startBtn.disabled = true;
  }

  // ===================== TTS =====================
  let voices = [];
  function loadVoices() {
    voices = synth.getVoices().filter(v => v.lang.toLowerCase().startsWith('en'));
    if (!voices.length) return;
    voiceSel.innerHTML = '';
    voices.forEach((v,i) => {
      const o = document.createElement('option');
      o.value=i; o.textContent = v.name+' ('+v.lang+')'+(v.localService?'':' ☁');
      voiceSel.appendChild(o);
    });
    const pref = voices.findIndex(v => v.lang==='en-US' && v.localService);
    voiceSel.value = pref>=0 ? pref : 0;
  }
  loadVoices();
  synth.onvoiceschanged = loadVoices;

  [[rate,'rateVal'],[pitch,'pitchVal'],[vol,'volVal']].forEach(function(p){
    p[0].oninput = function(){ $(p[1]).textContent = Number(p[0].value).toFixed(1); };
  });

  function enqueueSpeech(text, node) {
    if (!text || !text.trim()) return;
    speakQueue.push({ text: text, node: node });
    pumpSpeech();
  }

  function pumpSpeech() {
    if (speaking || !speakQueue.length) return;
    const job = speakQueue.shift();
    const u = new SpeechSynthesisUtterance(job.text);
    const v = voices[voiceSel.value];
    if (v) { u.voice=v; u.lang=v.lang; } else u.lang='en-US';
    u.rate=+rate.value; u.pitch=+pitch.value; u.volume=+vol.value;

    u.onstart = function () {
      speaking = true;
      if (job.node) job.node.classList.add('speaking');
      if (listening && !manualStop) { pausedForTTS = true; try { recog.abort(); } catch(_){} }
      setStatus('영어 읽는 중…', 'speak');
    };
    const done = function () {
      speaking = false;
      if (job.node) job.node.classList.remove('speaking');
      if (speakQueue.length) { pumpSpeech(); return; }
      if (pausedForTTS) {
        pausedForTTS = false;
        setTimeout(function(){
          if (!manualStop && !pausedForEdit) { try { recog.start(); } catch(_){} }
        }, 250);
      } else if (!listening) setStatus('대기 중', null);
    };
    u.onend = done; u.onerror = done;
    synth.speak(u);
  }

  function stopSpeaking() {
    speakQueue = []; synth.cancel(); speaking = false;
    Array.prototype.forEach.call(document.querySelectorAll('.txt.speaking'),
      function(n){ n.classList.remove('speaking'); });
    if (pausedForTTS) {
      pausedForTTS = false;
      if (!manualStop && !pausedForEdit) { try { recog.start(); } catch(_){} }
    }
  }

  // ===================== 번역 =====================
  const hasTranslator = ('Translator' in self);
  if (!hasTranslator) {
    banner.style.display='block';
    banner.innerHTML += (banner.innerHTML?'<br><br>':'') +
      '브라우저 내장 <b>Translator API</b>가 없어 자동 번역이 비활성화됩니다. ' +
      'Chrome 138+ 에서 <code>chrome://flags/#translation-api</code> 를 Enabled 로 설정하세요. ' +
      '(이 경우 오른쪽 패널에 원문이 복사되며, 직접 영어로 고쳐 쓰면 낭독됩니다.)';
    trStatus.textContent = '미지원 — 수동 입력 가능';
  }

  async function getTranslator(src) {
    if (!hasTranslator || src === 'en') return null;
    if (translator && translatorLang === src) return translator;
    if (translator) { if (translator.destroy) translator.destroy(); translator = null; }
    trStatus.textContent = '준비 중…';
    const opts = { sourceLanguage: src, targetLanguage: 'en' };
    try {
      if (await Translator.availability(opts) === 'unavailable') {
        trStatus.textContent = src+'→en 미지원'; return null;
      }
      translator = await Translator.create(Object.assign({}, opts, {
        monitor: function(m){
          m.addEventListener('downloadprogress', function(e){
            trStatus.textContent = '모델 다운로드 '+Math.round(e.loaded*100)+'%';
          });
        }
      }));
      translatorLang = src; trStatus.textContent = '준비됨';
      return translator;
    } catch(e) { trStatus.textContent = '번역기 오류'; return null; }
  }

  let transQueue=[], transWorking=false;
  function requestTranslate(row) {
    row.enTxt.classList.add('pending');
    row.enTxt.textContent = row.srcTxt.textContent;
    transQueue = transQueue.filter(function(r){ return r !== row; });
    transQueue.push(row);
    pumpTranslate();
  }
  async function pumpTranslate() {
    if (transWorking || !transQueue.length) return;
    transWorking = true;
    try {
      const tr = await getTranslator(langSel.selectedOptions[0].dataset.t);
      while (transQueue.length) {
        const row = transQueue.shift();
        if (!row.el.isConnected) continue;
        const text = row.srcTxt.textContent.trim();
        let out = text;
        if (tr && text) {
          try { out = await tr.translate(text); }
          catch(e) { out = text + '  [번역 실패]'; }
        }
        if (document.activeElement === row.enTxt) { row.enTxt.classList.remove('pending'); continue; }
        row.enTxt.textContent = out;
        row.enTxt.classList.remove('pending');
        row.enEdited = false;
        row.enTxt.classList.remove('edited');
        autoScroll(enBox);
        if (row.speakAfter) { row.speakAfter = false; enqueueSpeech(out, row.enTxt); }
      }
    } finally { transWorking = false; }
  }

  // ===================== 행(row) 생성 · 편집 =====================
  function makeTxt(cls) {
    const d = document.createElement('div');
    d.className = 'txt' + (cls || '');
    d.contentEditable = 'true';
    d.spellcheck = false;
    return d;
  }

  function mini(label, title, extra) {
    const b = document.createElement('button');
    b.className = 'mini' + (extra ? ' '+extra : '');
    b.textContent = label; b.title = title; b.type = 'button';
    return b;
  }

  function createRow(text, opts) {
    opts = opts || {};
    const id = ++seq;
    const row = { id: id, speakAfter: !!opts.speak, enEdited: false };

    const sEl = document.createElement('div'); sEl.className = 'row';
    const sIdx = document.createElement('div'); sIdx.className='idx'; sIdx.textContent = id;
    const sTxt = makeTxt(); sTxt.textContent = text;
    const sTools = document.createElement('div'); sTools.className='tools';
    const sDel = mini('×','삭제','del');
    sTools.appendChild(sDel);
    sEl.appendChild(sIdx); sEl.appendChild(sTxt); sEl.appendChild(sTools);

    const eEl = document.createElement('div'); eEl.className = 'row';
    const eIdx = document.createElement('div'); eIdx.className='idx'; eIdx.textContent = id;
    const eTxt = makeTxt(' pending'); eTxt.textContent = text;
    const eTools = document.createElement('div'); eTools.className='tools';
    const ePlay = mini('▶','이 문장 읽기');
    const eRe = mini('↻','원문에서 다시 번역');
    eTools.appendChild(ePlay); eTools.appendChild(eRe);
    eEl.appendChild(eIdx); eEl.appendChild(eTxt); eEl.appendChild(eTools);

    row.el = sEl; row.enEl = eEl; row.srcTxt = sTxt; row.enTxt = eTxt;

    bindEdit(sTxt, function (changed) {
      if (!sTxt.textContent.trim()) { removeRow(row); return; }
      if (changed) {
        sTxt.classList.add('edited');
        row.speakAfter = reSpeak.checked;
        requestTranslate(row);
      }
    });

    bindEdit(eTxt, function (changed) {
      if (changed) {
        row.enEdited = true;
        eTxt.classList.add('edited');
        eTxt.classList.remove('pending');
        if (reSpeak.checked) enqueueSpeech(eTxt.textContent, eTxt);
      }
    });

    sDel.onclick = function(){ removeRow(row); };
    ePlay.onclick = function(){ enqueueSpeech(eTxt.textContent, eTxt); };
    eRe.onclick = function(){ row.speakAfter = false; requestTranslate(row); };

    srcBox.insertBefore(sEl, interimRow);
    enBox.appendChild(eEl);
    rows.push(row);
    return row;
  }

  function removeRow(row) {
    row.el.remove(); row.enEl.remove();
    rows = rows.filter(function(r){ return r !== row; });
  }

  function bindEdit(el, onCommit) {
    let before = '';
    el.addEventListener('focus', function () {
      before = el.textContent;
      pauseForEdit(true);
    });
    el.addEventListener('blur', function () {
      const now = el.textContent.replace(/\s+/g,' ').trim();
      el.textContent = now;
      pauseForEdit(false);
      onCommit(now !== before.replace(/\s+/g,' ').trim());
    });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el.blur(); }
      else if (e.key === 'Escape') { e.preventDefault(); el.textContent = before; el.blur(); }
      else if (e.key === 'Tab') {
        e.preventDefault();
        const all = Array.prototype.slice.call(document.querySelectorAll('.txt[contenteditable]'));
        const i = all.indexOf(el);
        const next = all[i + (e.shiftKey ? -1 : 1)];
        el.blur(); if (next) next.focus();
      }
    });
    el.addEventListener('paste', function (e) {
      e.preventDefault();
      const t = (e.clipboardData || window.clipboardData).getData('text');
      document.execCommand('insertText', false, t.replace(/\s+/g,' '));
    });
  }

  let editCount = 0;
  function pauseForEdit(on) {
    editCount += on ? 1 : -1;
    editCount = Math.max(0, editCount);
    const active = editCount > 0;
    if (active && !pausedForEdit) {
      pausedForEdit = true;
      if (listening && !manualStop) { try { recog.abort(); } catch(_){} }
      setStatus('편집 중 — 인식 일시정지', 'edit');
    } else if (!active && pausedForEdit) {
      pausedForEdit = false;
      setTimeout(function () {
        if (editCount > 0 || manualStop || speaking) return;
        if (recog) { try { recog.start(); } catch(_){} }
        else setStatus('대기 중', null);
      }, 200);
    }
  }

  // ===================== 레벨 미터 =====================
  async function startMeter() {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio:true });
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
      audioCtx.createMediaStreamSource(micStream).connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);
      (function loop(){
        analyser.getByteTimeDomainData(data);
        let sum=0;
        for (let i=0;i<data.length;i++){ const v=(data[i]-128)/128; sum+=v*v; }
        meterFill.style.width = Math.min(100, Math.sqrt(sum/data.length)*320)+'%';
        rafId = requestAnimationFrame(loop);
      })();
    } catch(e) {}
  }
  function stopMeter() {
    cancelAnimationFrame(rafId); meterFill.style.width='0%';
    if (micStream) micStream.getTracks().forEach(function(t){ t.stop(); });
    if (audioCtx) audioCtx.close();
    micStream=null; audioCtx=null;
  }

  // ===================== 음성 인식 =====================
  function createRecognition() {
    const r = new SR();
    r.lang = langSel.value;
    r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;

    r.onstart = function(){ listening = true; setStatus('듣는 중…', 'on'); };

    r.onresult = function (e) {
      if (speaking || pausedForEdit) return;
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          const s = t.trim();
          if (s) {
            const row = createRow(s, { speak: autoSpeak.checked });
            requestTranslate(row);
            autoScroll(srcBox);
          }
        } else interim += t;
      }
      interimTxt.textContent = interim;
      interimRow.style.display = interim ? 'flex' : 'none';
      if (interim) autoScroll(srcBox);
    };

    r.onerror = function (e) {
      if (e.error==='not-allowed' || e.error==='service-not-allowed') {
        setStatus('마이크 권한이 거부되었습니다', null); manualStop = true;
      } else if (e.error==='no-speech' || e.error==='aborted') { /* 무시 */ }
      else setStatus('오류: '+e.error, null);
    };

    r.onend = function () {
      listening = false;
      interimRow.style.display = 'none';
      if (pausedForTTS || pausedForEdit) return;
      if (!manualStop) { try { r.start(); } catch(_){} }
      else {
        setStatus('중지됨', null);
        startBtn.disabled=false; stopBtn.disabled=true; stopMeter();
      }
    };
    return r;
  }

  // ===================== 버튼 =====================
  startBtn.onclick = function () {
    manualStop = false;
    recog = createRecognition();
    try { recog.start(); } catch(_){}
    startBtn.disabled=true; stopBtn.disabled=false;
    startMeter();
    getTranslator(langSel.selectedOptions[0].dataset.t);
  };

  stopBtn.onclick = function () {
    manualStop = true; pausedForTTS = false;
    if (recog) recog.stop();
  };

  addBtn.onclick = function () {
    const row = createRow('', { speak:false });
    autoScroll(srcBox); autoScroll(enBox);
    row.srcTxt.focus();
  };

  speakAllBtn.onclick = function () {
    stopSpeaking();
    rows.forEach(function(r){ enqueueSpeech(r.enTxt.textContent, r.enTxt); });
  };
  stopSpeakBtn.onclick = stopSpeaking;

  clearBtn.onclick = function () {
    stopSpeaking();
    rows.slice().forEach(removeRow);
    seq = 0; transQueue = [];
    interimTxt.textContent=''; interimRow.style.display='none';
  };

  copyBtn.onclick = async function () {
    const text = rows.map(function(r){ return r.enTxt.textContent; }).join('\n');
    await navigator.clipboard.writeText(text);
    const old = copyBtn.textContent;
    copyBtn.textContent='복사됨!';
    setTimeout(function(){ copyBtn.textContent=old; }, 1200);
  };

  langSel.onchange = function () {
    srcLabel.textContent = langSel.selectedOptions[0].dataset.t;
    getTranslator(langSel.selectedOptions[0].dataset.t);
    if (recog && listening) {
      manualStop = true; recog.stop();
      setTimeout(function(){ startBtn.click(); }, 350);
    }
  };
  srcLabel.textContent = 'ko';

  window.addEventListener('beforeunload', function(){ synth.cancel(); });
})();
</script>
</body>
</html>
